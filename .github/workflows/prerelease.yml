name: prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v: node version, then -m and the wallet version, for example 4.0.4-m0.1.0"
        required: true
      build_type:
        description: "release uses the latest elektron-net tag, nightly uses its main branch"
        type: choice
        options: [release, nightly]
        default: release
      core_ref:
        description: "Optional elektron-net tag or commit to build (release builds accept release tags only)"
        required: false

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      node_version: ${{ steps.v.outputs.node_version }}
      mobile_version: ${{ steps.v.outputs.mobile_version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build_type: ${{ steps.t.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        env:
          INPUT_TYPE: ${{ inputs.build_type }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "build_type=release" >> "$GITHUB_OUTPUT"; else echo "build_type=${INPUT_TYPE:-release}" >> "$GITHUB_OUTPUT"; fi
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; else version=$INPUT_VERSION; fi
          python3 -I tools/version.py "$version" --mobile-file app/mobile-version.txt > "$RUNNER_TEMP/version.out"
          cat "$RUNNER_TEMP/version.out" | tee -a "$GITHUB_OUTPUT"

  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
      CORE_REF: ${{ needs.prepare.outputs.build_type == 'release' && format('v{0}', needs.prepare.outputs.node_version) || inputs.core_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the NDK checksum
        run: |
          source native-build/core-source.env
          if [[ -z ${NDK_SHA256:-} ]]; then
            NDK_SHA256=$(bash native-build/pin-ndk.sh)
            echo "::warning::NDK_SHA256 is not pinned in native-build/core-source.env. This run used $NDK_SHA256. Compare it with Google's published checksum and pin it."
          fi
          echo "NDK_SHA256=$NDK_SHA256" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: native-build/build-cache
          key: native-${{ hashFiles('native-build/core-source.env', 'native-build/helpers-source.env', 'native-build/docker/**', 'native-build/helpers/**') }}-${{ github.run_id }}
          restore-keys: |
            native-${{ hashFiles('native-build/core-source.env', 'native-build/helpers-source.env', 'native-build/docker/**', 'native-build/helpers/**') }}-
      - name: Build elektrond, Tor and i2pd for arm64-v8a and x86_64
        run: bash native-build/build.sh all
      - name: Pack the node libraries
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libelektrond.so
          test -f app/src/main/jniLibs/arm64-v8a/libtor.so
          test -f app/src/main/jniLibs/arm64-v8a/libi2pd.so
          tar -C app/src/main -cf native.tar jniLibs assets/core-manifest assets/i2pd
      - uses: actions/upload-artifact@v4
        with:
          name: native
          retention-days: 7
          path: native.tar

  apk:
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      NODE_VERSION: ${{ needs.prepare.outputs.node_version }}
      MOBILE_VERSION: ${{ needs.prepare.outputs.mobile_version }}
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: .
      - name: Unpack the node libraries
        run: |
          tar -C app/src/main -xf native.tar
          test -f app/src/main/jniLibs/arm64-v8a/libelektrond.so
          ls -l app/src/main/jniLibs/*/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Peer country database
        run: bash tools/fetch-geoip.sh
      - name: Build the APKs
        run: |
          variant=Nightly; dir=nightly
          gradle --no-daemon -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE" -PappNodeVersion="$NODE_VERSION" \
            ":app:assembleMainnet$variant" ":app:assembleTnet$variant"
          mkdir -p dist
          cp "app/build/outputs/apk/mainnet/$dir/app-mainnet-$dir.apk" "dist/Elektron-Mobile-$VERSION.apk"
          cp "app/build/outputs/apk/tnet/$dir/app-tnet-$dir.apk" "dist/Elektron-Mobile-$VERSION-testnet.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Release notes
        run: |
          manifest=app/src/main/assets/core-manifest/arm64-v8a.env
          get() { grep "^$1=" "$manifest" | cut -d= -f2-; }
          {
            echo "Elektron Mobile v$VERSION"
            echo
            echo "Android wallet with its own Elektron Net full node. The version has two parts: the Elektron Net node version ($NODE_VERSION) and the wallet version (m$MOBILE_VERSION). A wallet update without a new node only changes the second part."
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Node version | $NODE_VERSION |"
            echo "| Wallet version | $MOBILE_VERSION |"
            echo "| Build type | $BUILD_TYPE |"
            echo "| Node source | $(get CORE_REPO_URL) |"
            echo "| Node ref | $(get CORE_REF_NAME) |"
            echo "| Node commit | $(get CORE_SHA) |"
            echo "| Node library SHA-256 (arm64-v8a) | $(get LIB_SHA256) |"
            echo "| Signing | public test key (app/test-signing), not for distribution |"
            echo
            echo "Files:"
            echo
            echo "- \`Elektron-Mobile-$VERSION.apk\`: the Elektron app (mainnet, real coins)"
            echo "- \`Elektron-Mobile-$VERSION-testnet.apk\`: the Elektron (T) app (testnet, coins have no value), installs next to the mainnet app"
            echo "- \`SHA256SUMS.txt\`: checksums of both files"
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS.txt\`."
            echo
            echo "Test build signed with the public test key, application ID with the .nightly suffix. It never replaces an install from a release."
            echo
            echo "This is pre-release software. Do not store significant funds before an independent security review. Always keep your recovery phrase offline."
          } > dist/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: [prepare, apk]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update the release
        env:
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          flags=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "Elektron Mobile v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --target "$TARGET" --title "Elektron Mobile v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          fi
