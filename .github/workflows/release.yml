name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v: node version, then -m and the wallet version, for example 4.0.4-m0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      node_version: ${{ steps.v.outputs.node_version }}
      mobile_version: ${{ steps.v.outputs.mobile_version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; else version=$INPUT_VERSION; fi
          python3 -I tools/version.py "$version" --mobile-file app/mobile-version.txt > "$RUNNER_TEMP/version.out"
          cat "$RUNNER_TEMP/version.out" | tee -a "$GITHUB_OUTPUT"

  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_TYPE: release
      CORE_REF: ${{ format('v{0}', needs.prepare.outputs.node_version) }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the NDK checksum
        run: |
          source native-build/core-source.env
          if [[ -z ${NDK_SHA256:-} ]]; then
            NDK_SHA256=$(bash native-build/pin-ndk.sh)
            echo "::warning::NDK_SHA256 is not pinned in native-build/core-source.env. This run used $NDK_SHA256. Compare it with Google's published checksum and pin it."
          fi
          echo "NDK_SHA256=$NDK_SHA256" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: native-build/build-cache
          key: native-${{ hashFiles('native-build/core-source.env', 'native-build/helpers-source.env', 'native-build/docker/**', 'native-build/helpers/**') }}-${{ github.run_id }}
          restore-keys: |
            native-${{ hashFiles('native-build/core-source.env', 'native-build/helpers-source.env', 'native-build/docker/**', 'native-build/helpers/**') }}-
      - name: Build elektrond, Tor and i2pd for arm64-v8a and x86_64
        run: bash native-build/build.sh all
      - name: Pack the node libraries
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libelektrond.so
          test -f app/src/main/jniLibs/arm64-v8a/libtor.so
          test -f app/src/main/jniLibs/arm64-v8a/libi2pd.so
          tar -C app/src/main -cf native.tar jniLibs assets/core-manifest assets/i2pd
      - uses: actions/upload-artifact@v4
        with:
          name: native
          retention-days: 7
          path: native.tar

  apk:
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      NODE_VERSION: ${{ needs.prepare.outputs.node_version }}
      MOBILE_VERSION: ${{ needs.prepare.outputs.mobile_version }}
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: .
      - name: Unpack the node libraries
        run: |
          tar -C app/src/main -xf native.tar
          test -f app/src/main/jniLibs/arm64-v8a/libelektrond.so
          ls -l app/src/main/jniLibs/*/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ELEKTRON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELEKTRON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELEKTRON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELEKTRON_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z ${!name} ]]; then
              echo "::error::The repository secret for $name is missing. A release is only built with the release key. Use the prerelease workflow for test builds."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ELEKTRON_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "ELEKTRON_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ELEKTRON_KEY_ALIAS=$KEY_ALIAS"
            echo "ELEKTRON_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Peer country database
        run: bash tools/fetch-geoip.sh
      - name: Build the APKs
        run: |
          variant=Release; dir=release
          gradle --no-daemon -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE" -PappNodeVersion="$NODE_VERSION" \
            ":app:assembleMainnet$variant" ":app:assembleTnet$variant"
          mkdir -p dist
          cp "app/build/outputs/apk/mainnet/$dir/app-mainnet-$dir.apk" "dist/Elektron-Mobile-$VERSION.apk"
          cp "app/build/outputs/apk/tnet/$dir/app-tnet-$dir.apk" "dist/Elektron-Mobile-$VERSION-testnet.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Check the signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ELEKTRON_RELEASE_CERT_SHA256 }}
        run: |
          apksigner=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          test_cert=$(keytool -list -v -keystore app/test-signing/elektron-test.jks -storepass elektrontest | sed -n 's/^[[:space:]]*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          : > "$RUNNER_TEMP/certs.txt"
          for apk in dist/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/verify.txt"
            cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/verify.txt" | head -1)
            echo "$(basename "$apk"): $cert"
            [[ -n $cert ]] || { echo "::error::No signing certificate found in $apk"; exit 1; }
            [[ $cert != "$test_cert" ]] || { echo "::error::$apk is signed with the public test key"; exit 1; }
            if [[ -n $EXPECTED_CERT_SHA256 && $cert != "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')" ]]; then
              echo "::error::$apk certificate $cert does not match ELEKTRON_RELEASE_CERT_SHA256"; exit 1
            fi
            echo "$cert" >> "$RUNNER_TEMP/certs.txt"
          done
          echo "CERT_SHA256=$(sort -u "$RUNNER_TEMP/certs.txt" | head -1)" >> "$GITHUB_ENV"
      - name: Release notes
        run: |
          manifest=app/src/main/assets/core-manifest/arm64-v8a.env
          get() { grep "^$1=" "$manifest" | cut -d= -f2-; }
          {
            echo "Elektron Mobile v$VERSION"
            echo
            echo "Android wallet with its own Elektron Net full node. The version has two parts: the Elektron Net node version ($NODE_VERSION) and the wallet version (m$MOBILE_VERSION). A wallet update without a new node only changes the second part."
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Node version | $NODE_VERSION |"
            echo "| Wallet version | $MOBILE_VERSION |"
            echo "| Build type | $BUILD_TYPE |"
            echo "| Node source | $(get CORE_REPO_URL) |"
            echo "| Node ref | $(get CORE_REF_NAME) |"
            echo "| Node commit | $(get CORE_SHA) |"
            echo "| Node library SHA-256 (arm64-v8a) | $(get LIB_SHA256) |"
            echo "| Signing certificate SHA-256 | $CERT_SHA256 |"
            echo
            echo "Files:"
            echo
            echo "- \`Elektron-Mobile-$VERSION.apk\`: the Elektron app (mainnet, real coins)"
            echo "- \`Elektron-Mobile-$VERSION-testnet.apk\`: the Elektron (T) app (testnet, coins have no value), installs next to the mainnet app"
            echo "- \`SHA256SUMS.txt\`: checksums of both files"
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS.txt\`, and compare the signing certificate with \`apksigner verify --print-certs <apk>\`."
            echo
            echo "This is beta software. It has been tested in practice and the wallet runs stably, so it can be used for everyday amounts. Keep larger holdings in a cold wallet until an independent security review is done. Always keep your recovery phrase offline."
          } > dist/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: [prepare, apk]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update the release
        env:
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          flags=()
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "Elektron Mobile v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --target "$TARGET" --title "Elektron Mobile v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          fi
