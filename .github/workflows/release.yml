name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 4.0.4"
        required: true
      build_type:
        description: "release uses the latest elektron-net tag, nightly uses its main branch"
        type: choice
        options: [release, nightly]
        default: release
      core_ref:
        description: "Optional elektron-net tag or commit to build (release builds accept release tags only)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      build_type: ${{ steps.v.outputs.build_type }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.build_type }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            build_type=release
          else
            version=${INPUT_VERSION#v}
            build_type=${INPUT_TYPE:-release}
          fi
          [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid version '$version'" >&2; exit 1; }
          code=$(( (BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]) * 1000 + GITHUB_RUN_NUMBER % 1000 ))
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "build_type=$build_type"
            echo "version_code=$code"
          } >> "$GITHUB_OUTPUT"

  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
      CORE_REF: ${{ inputs.core_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the NDK checksum
        run: |
          source native-build/core-source.env
          if [[ -z ${NDK_SHA256:-} ]]; then
            NDK_SHA256=$(bash native-build/pin-ndk.sh)
            echo "::warning::NDK_SHA256 is not pinned in native-build/core-source.env. This run used $NDK_SHA256. Compare it with Google's published checksum and pin it."
          fi
          echo "NDK_SHA256=$NDK_SHA256" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: native-build/build-cache
          key: native-${{ hashFiles('native-build/core-source.env', 'native-build/docker/**') }}-${{ github.run_id }}
          restore-keys: |
            native-${{ hashFiles('native-build/core-source.env', 'native-build/docker/**') }}-
      - name: Build elektrond for arm64-v8a and x86_64
        run: bash native-build/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: native
          retention-days: 7
          path: |
            app/src/main/jniLibs
            app/src/main/assets/core-manifest

  apk:
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - id: sign
        name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ELEKTRON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELEKTRON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELEKTRON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELEKTRON_KEY_PASSWORD }}
        run: |
          if [[ -n $KEYSTORE_BASE64 ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ELEKTRON_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "ELEKTRON_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ELEKTRON_KEY_ALIAS=$KEY_ALIAS"
              echo "ELEKTRON_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release key configured. The APKs are signed with a temporary test key and are not for distribution."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APKs
        run: |
          if [[ ${{ steps.sign.outputs.signed }} == true ]]; then
            variant=Release; dir=release
          else
            variant=Nightly; dir=nightly
          fi
          gradle --no-daemon -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE" \
            ":app:assembleMainnet$variant" ":app:assembleTnet$variant"
          mkdir -p dist
          cp "app/build/outputs/apk/mainnet/$dir/app-mainnet-$dir.apk" "dist/Elektron-Mobile-$VERSION.apk"
          cp "app/build/outputs/apk/tnet/$dir/app-tnet-$dir.apk" "dist/Elektron-Mobile-$VERSION-testnet.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Release notes
        run: |
          manifest=app/src/main/assets/core-manifest/arm64-v8a.env
          get() { grep "^$1=" "$manifest" | cut -d= -f2-; }
          {
            echo "Elektron Mobile $VERSION"
            echo
            echo "Android wallet with its own Elektron Net full node."
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| App version | $VERSION |"
            echo "| Build type | $BUILD_TYPE |"
            echo "| Node source | $(get CORE_REPO_URL) |"
            echo "| Node ref | $(get CORE_REF_NAME) |"
            echo "| Node commit | $(get CORE_SHA) |"
            echo "| Node library SHA-256 (arm64-v8a) | $(get LIB_SHA256) |"
            echo "| Signing | $([[ ${{ steps.sign.outputs.signed }} == true ]] && echo 'release key' || echo 'temporary test key, not for distribution') |"
            echo
            echo "Files:"
            echo
            echo "- \`Elektron-Mobile-$VERSION.apk\`: the Elektron app (mainnet, real coins)"
            echo "- \`Elektron-Mobile-$VERSION-testnet.apk\`: the Elektron (T) app (testnet, coins have no value), installs next to the mainnet app"
            echo "- \`SHA256SUMS.txt\`: checksums of both files"
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS.txt\`."
            echo
            echo "This is pre-release software. Do not store significant funds before an independent security review. Always keep your recovery phrase offline."
          } > dist/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: [prepare, apk]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
      SIGNED: ${{ needs.apk.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update the release
        env:
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          flags=()
          if [[ $BUILD_TYPE != release || $SIGNED != true || $VERSION == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "Elektron Mobile v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --target "$TARGET" --title "Elektron Mobile v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          fi
