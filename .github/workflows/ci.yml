name: ci

on:
  push:
    branches: [mobilenode, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Contrast gate
        run: python3 -I design/check-contrast.py
      - name: Theme generator
        run: python3 -I design/gen-theme.py --out "$RUNNER_TEMP/theme"
      - name: Locales
        run: python3 -I tools/check-locales.py .
      - name: Randomness sources
        run: python3 -I tools/check-rng.py
      - name: Version scheme
        run: python3 -I tools/version.py --selftest
      - name: Build script tests
        run: bash native-build/tests/test-fetch-core.sh

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Peer country database
        run: bash tools/fetch-geoip.sh
      - name: Build both flavors
        run: gradle --no-daemon :app:assembleMainnetDebug :app:assembleTnetDebug
      - name: Unit tests and lint for both flavors
        run: gradle --no-daemon :app:testMainnetDebugUnitTest :app:testTnetDebugUnitTest :app:lintMainnetDebug :app:lintTnetDebug
      - name: Lint details
        if: failure()
        run: grep -h -A3 "Error:" app/build/reports/lint-results-*.txt app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt 2>/dev/null | head -150 || true
